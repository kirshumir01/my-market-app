services:

  postgres:
    image: postgres:16
    container_name: my-market-postgres-dev

    restart: unless-stopped

    environment:
      POSTGRES_DB: my-market-app
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d my-market-app"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres-data-dev:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: my-market-redis-dev

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data-dev: