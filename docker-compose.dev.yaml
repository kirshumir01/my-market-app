services:

  postgres:
    image: postgres:16
    container_name: my-market-postgres-dev

    restart: unless-stopped

    environment:
      POSTGRES_DB: my-market-app-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data-dev:/var/lib/postgresql/data

volumes:
  postgres-data-dev: