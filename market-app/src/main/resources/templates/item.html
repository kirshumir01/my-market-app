<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <a th:href="@{/items}"
                           class="badge text-bg-success text-decoration-none">
                            Витрина магазина
                        </a>
                    </h2>

                    <div class="small text-secondary">
                        <span sec:authorize="isAuthenticated()">
                            Пользователь:
                            <strong sec:authentication="name"></strong>
                        </span>

                        <span sec:authorize="isAnonymous()">
                            guest (unauthorized)
                        </span>
                    </div>

                    <a th:href="@{/login}"
                       class="btn btn-outline-primary">
                        Войти
                    </a>

                    <form sec:authorize="isAuthenticated()"
                          method="post"
                          th:action="@{/logout}"
                          class="mb-0">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button type="submit"
                                class="btn btn-outline-secondary">
                            Выйти
                        </button>
                    </form>

                    <a th:if="${isAdmin}"
                       th:href="@{/items/new}"
                       class="btn btn-success">
                        <i class="bi bi-plus-circle"></i>
                        Новый товар
                    </a>

                    <a sec:authorize="isAuthenticated()"
                       th:href="@{/orders}"
                       class="btn btn-secondary ms-auto">
                        <i class="bi bi-file-earmark-text"></i>
                        Заказы
                    </a>

                    <a sec:authorize="isAuthenticated()"
                       th:href="@{/cart/items}"
                       class="btn btn-secondary">
                        <i class="bi bi-cart4"></i>
                        Корзина
                    </a>
                </div>
            </div>
        </div>
        <div class="row p-2">
            <div class="col">
                <div class="card">
                    <img class="p-2"
                         th:src="@{/{imgPath}(imgPath=${item.imgPath})}"
                         alt="Нет изображения"
                         width="300"
                         height="300">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${item.title}"></h5>
                        <h5>
                            <span class="badge text-bg-success justify-content-end" th:text="${item.price}+' руб.'"></span>
                        </h5>
                        <p class="card-text" th:text="${item.description}"></p>
                        <form sec:authorize="isAuthenticated()"
                              method="post"
                              th:action="@{/items/{id}(id=${item.id})}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <div class="hstack gap-3">
                                <button type="submit"
                                        class="btn btn-outline-secondary"
                                        name="action"
                                        value="MINUS"
                                        th:disabled="${item.count == 0}">
                                    -
                                </button>

                                <span th:text="${item.count}"></span>

                                <button type="submit"
                                        class="btn btn-outline-secondary"
                                        name="action"
                                        value="PLUS">
                                    +
                                </button>

                                <button type="submit"
                                        class="btn btn-warning ms-auto bi bi-cart4"
                                        name="action"
                                        value="PLUS"
                                        th:if="${item.count == 0}"
                                        aria-label="Добавить в корзину">
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
