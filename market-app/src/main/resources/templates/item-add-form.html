<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Добавление товара</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <a th:href="@{/items}"
                       class="badge text-bg-success text-decoration-none">
                        Витрина магазина
                    </a>
                </h2>

                <div class="small text-secondary">
                    <span sec:authorize="isAuthenticated()">
                        Пользователь:
                        <strong sec:authentication="name"></strong>
                    </span>

                    <span sec:authorize="isAnonymous()">
                        guest (unauthorized)
                    </span>
                </div>

                <form sec:authorize="isAuthenticated()"
                      method="post"
                      th:action="@{/logout}"
                      class="mb-0">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="btn btn-outline-secondary">
                        Выйти
                    </button>
                </form>

                <a sec:authorize="isAuthenticated()"
                   th:href="@{/orders}"
                   class="btn btn-secondary ms-auto bi bi-file-earmark-text">
                    Заказы
                </a>

                <a sec:authorize="isAuthenticated()"
                   th:href="@{/cart/items}"
                   class="btn btn-secondary bi bi-cart4">
                    Корзина
                </a>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="card">
                <div class="card-body">

                    <h3 class="mb-4">Добавить товар</h3>

                    <form th:if="${isAdmin}"
                          method="post"
                          th:action="@{/items/new}">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">
                                Название товара
                            </label>
                            <input class="form-control"
                                   type="text"
                                   name="title"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Описание товара
                            </label>
                            <textarea class="form-control"
                                      name="description"
                                      required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Цена
                            </label>
                            <input class="form-control"
                                   type="number"
                                   name="price"
                                   min="1"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Путь к картинке
                            </label>
                            <input class="form-control"
                                   type="text"
                                   name="imgPath"
                                   placeholder="images/product.png">
                        </div>

                        <button class="btn btn-success"
                                type="submit">
                            Сохранить
                        </button>

                        <a class="btn btn-secondary"
                           th:href="@{/items}">
                            Отмена
                        </a>
                    </form>

                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

</body>
</html>
