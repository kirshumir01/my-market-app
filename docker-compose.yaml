services:
  postgres:
    image: postgres:16
    container_name: my-market-postgres
    restart: always

    environment:
      POSTGRES_DB: my-market-app
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d my-market-app"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: my-market-app
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data: